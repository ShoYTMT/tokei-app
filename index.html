<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="時計">
  <title>時計</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
      --page-bg: #000000;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--page-bg);
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
    }

    main {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      padding:
        max(10px, env(safe-area-inset-top))
        max(14px, env(safe-area-inset-right))
        max(10px, env(safe-area-inset-bottom))
        max(14px, env(safe-area-inset-left));
      background: var(--page-bg);
      transition: background-color 160ms ease;
    }

    .tools {
      z-index: 1;
      display: grid;
      justify-self: end;
      width: min(45vw, 390px);
      gap: 7px;
    }

    .clock-stage {
      display: grid;
      place-items: center;
      min-width: 0;
      min-height: 0;
    }

    #clock {
      color: #fff;
      font-size: min(17.4vw, 72vh);
      font-weight: 700;
      line-height: 0.9;
      letter-spacing: -0.055em;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
      user-select: none;
      -webkit-user-select: none;
    }

    #memo {
      width: 100%;
      min-height: 58px;
      max-height: 28vh;
      padding: 10px 13px;
      resize: none;
      overflow-y: auto;
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 10px;
      outline: none;
      background: rgba(20, 20, 20, 0.78);
      color: #fff;
      font: inherit;
      font-size: clamp(20px, 2.8vw, 28px);
      font-weight: 600;
      line-height: 1.3;
      text-align: right;
      caret-color: #fff;
      -webkit-appearance: none;
      appearance: none;
    }

    #memo::placeholder {
      color: rgba(255, 255, 255, 0.52);
    }

    #memo:focus {
      border-color: rgba(255, 255, 255, 0.7);
      background: rgba(20, 20, 20, 0.94);
    }

    .colors {
      display: flex;
      justify-content: flex-end;
      gap: 9px;
    }

    .color-button {
      width: 26px;
      height: 26px;
      padding: 0;
      border: 2px solid rgba(255, 255, 255, 0.42);
      border-radius: 50%;
      background: var(--swatch);
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .color-button[aria-pressed="true"] {
      border-color: #fff;
      box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.32);
    }

    @media (max-height: 330px) and (orientation: landscape) {
      main {
        padding-top: max(6px, env(safe-area-inset-top));
        padding-bottom: max(6px, env(safe-area-inset-bottom));
      }

      .tools {
        width: min(43vw, 360px);
        gap: 4px;
      }

      #memo {
        min-height: 48px;
        max-height: 22vh;
        padding-block: 7px;
      }

      .color-button {
        width: 22px;
        height: 22px;
      }

      #clock {
        font-size: min(17vw, 62vh);
      }
    }
  </style>
</head>
<body>
  <main>
    <section class="tools" aria-label="メモと背景色">
      <textarea id="memo" rows="2" maxlength="100" aria-label="メモ" placeholder="休憩　12:00まで"></textarea>
      <div class="colors" aria-label="背景色を選択">
        <button class="color-button" type="button" data-color="#000000" style="--swatch:#000000" aria-label="背景を黒にする" aria-pressed="true"></button>
        <button class="color-button" type="button" data-color="#112A46" style="--swatch:#112A46" aria-label="背景を紺にする" aria-pressed="false"></button>
        <button class="color-button" type="button" data-color="#512338" style="--swatch:#512338" aria-label="背景をえんじ色にする" aria-pressed="false"></button>
      </div>
    </section>
    <div class="clock-stage">
      <time id="clock" aria-label="現在時刻">00:00:00</time>
    </div>
  </main>

  <script>
    (() => {
      "use strict";

      const clock = document.getElementById("clock");
      const memo = document.getElementById("memo");
      const colorButtons = [...document.querySelectorAll(".color-button")];
      const themeColor = document.querySelector('meta[name="theme-color"]');
      const memoKey = "simple-clock-memo";
      const colorKey = "simple-clock-background";
      const defaultColor = "#000000";

      function applyBackground(color) {
        const selectedColor = colorButtons.some((button) => button.dataset.color === color)
          ? color
          : defaultColor;

        document.documentElement.style.setProperty("--page-bg", selectedColor);
        themeColor.setAttribute("content", selectedColor);
        colorButtons.forEach((button) => {
          button.setAttribute("aria-pressed", String(button.dataset.color === selectedColor));
        });
      }

      function updateClock() {
        const now = new Date();
        const hours = String(now.getHours()).padStart(2, "0");
        const minutes = String(now.getMinutes()).padStart(2, "0");
        const seconds = String(now.getSeconds()).padStart(2, "0");
        clock.textContent = `${hours}:${minutes}:${seconds}`;
        clock.dateTime = now.toISOString();
      }

      try {
        memo.value = localStorage.getItem(memoKey) || "";
        applyBackground(localStorage.getItem(colorKey) || defaultColor);
      } catch (_) {
        applyBackground(defaultColor);
        // 保存が利用できない環境でも、時計とメモ入力はそのまま使えます。
      }

      memo.addEventListener("input", () => {
        try {
          localStorage.setItem(memoKey, memo.value);
        } catch (_) {
          // 保存容量などの理由で失敗しても、入力操作は妨げません。
        }
      });

      colorButtons.forEach((button) => {
        button.addEventListener("click", () => {
          const color = button.dataset.color;
          applyBackground(color);
          try {
            localStorage.setItem(colorKey, color);
          } catch (_) {
            // 保存できない場合も、選択中は背景色を反映します。
          }
        });
      });

      updateClock();
      setInterval(updateClock, 1000);
    })();
  </script>
</body>
</html>
